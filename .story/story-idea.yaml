- title: 外部サービス連携による開発ワークフローの統合
  description: |
    story.yaml を開発のハブとして機能させるため、GitHub Issues との連携機能を提案します。
    これにより、計画（story.yaml）と実行（GitHub Issues, Gitブランチ）が双方向に同期し、
    開発プロセス全体がシームレスに繋がります。
  reasoning: |
    現状の機能はVS Code内で完結していますが、実際の開発ではGitHub IssuesやGitブランチが多用されます。
    計画と実行が分断されていると、二重管理や情報の陳腐化が発生しがちです。
    この連携機能は、ストーリー駆動開発を実際のコーディング作業と直結させ、
    story.yaml を信頼できる唯一の情報源（Single Source of Truth）に昇格させるための重要なステップです。
  example_stories:
    - title: GitHub Issueへのエクスポート
      as: 開発者
      i want: story.yaml上のストーリーやタスクから、ワンクリックでGitHub Issueを作成したい
      so that: 計画アイテムをすぐさま開発タスクとしてトラッキングできるようにするため
      definition of done:
        - WebViewのアイテム詳細に「Create GitHub Issue」ボタンが追加される
        - ボタンをクリックすると、ストーリーのタイトル、説明（`as, i want, so that`形式）を本文に含んだIssue作成画面がプリセットされる
        - 作成されたIssueのURLが、元のstory.yamlアイテムにメタデータとして自動的に追記される

    - title: GitHub Issueステータスとの同期
      as: 開発者
      i want: 連携済みのGitHub IssueがCloseされたら、対応するstory.yaml上のアイテムのステータスが自動的に「Done」に更新されてほしい
      so that: Issueの進捗を手動でstory.yamlに反映させる手間をなくすため
      definition of done:
        - GitHub Webhookまたは定期的なAPIポーリングにより、連携済みIssueのステータス変更を検知する
        - IssueがCloseされると、対応するstory.yamlアイテムの`status`が`Done`に更新される
        - 逆に、story.yaml側でステータスを変更してもIssueには影響しない（一方向同期）

- title: AIによるストーリー作成・改善支援
  description: |
    質の高いユーザーストーリー作成を支援するため、AI（大規模言語モデル）を活用した機能を提案します。
    これにより、ストーリーの品質向上と作成時間の短縮が期待できます。
  reasoning: |
    良いストーリーを書くには経験と時間が必要です。特にINVEST原則を満たすような分割や、
    具体的でテスト可能な完了条件（DoD）の定義は難しい作業です。
    AIエージェントとの対話で開発を進めるという本プロジェクトの思想に基づき、
    その支援機能を拡張機能自体に組み込むことは、自然な発展と言えます。
  example_stories:
    - title: AIによるストーリーの分割提案
      as: プロダクトオーナー
      i want: 大きすぎる（ポイントが高い、またはDoDが多すぎる）ストーリーを、AIがより小さなストーリーに分割する提案をしてほしい
      so that: INVEST原則の「S (Small)」を満たすストーリーを簡単に作成できるようにするため
      definition of done:
        - アイテム詳細画面に「Suggest Split by AI」ボタンが追加される
        - ボタンをクリックすると、AIが現在のストーリーのタイトルやDoDを分析し、複数の小さなストーリー案を提示する
        - ユーザーは提案されたストーリーを選択して、現在のストーリーを置き換えることができる

    - title: AIによる完了条件（DoD）の具体化支援
      as: 開発者
      i want: 曖昧な完了条件（例：「ユーザーが使いやすいようにする」）に対して、AIがより具体的でテスト可能な完了条件の候補を提案してほしい
      so that: 受け入れ基準の明確な、質の高いストーリーを作成できるようにするため
      definition of done:
        - DoDの入力エリアの横に「Suggest DoD by AI」ボタンが追加される
        - ボタンをクリックすると、AIがストーリーの目的を解釈し、検証可能なDoDのリストを3〜5個提案する
        - ユーザーは提案されたDoDを選択して、リストに追加できる

- title: カンバンボード形式でのプレビュー機能
  description: |
    現在のテーブル表示に加え、ステータスに基づいたカンバンボード形式の表示モードを提案します。
  reasoning: |
    テーブル表示は一覧性に優れていますが、スプリント全体の進捗状況を把握するには、
    「ToDo」「WIP」「Done」といったステータスごとの流れを可視化できるカンバンボードが非常に有効です。
    これはアジャイル開発におけるデファクトスタンダードの可視化手法であり、多くのユーザーにとって直感的で馴染み深いUIです。
    既存のプレビュー機能の自然な拡張となります。
  example_stories:
    - title: カンバンボード表示
      as: ユーザー
      i want: ストーリーをステータス（ToDo, WIP, Done）ごとのカラムに表示するカンバンボード形式でプレビューしたい
      so that: プロジェクト全体の進捗状況を視覚的に把握できるようにするため
      definition of done:
        - WebViewに「Table / Board」を切り替えるスイッチが追加される
        - ボードは「ToDo」「WIP」「Done」のカラムを持つ
        - 各ストーリーやタスクはカードとして、そのステータスに対応するカラムに表示される
        - カードにはタイトルとポイント数が表示される

    - title: ドラッグ＆ドロップによるステータス変更
      as: ユーザー
      i want: カンバンボード上でカードをドラッグ＆ドロップして、別のカラムに移動させたい
      so that: 直感的な操作でストーリーのステータスを更新できるようにするため
      definition of done:
        - ユーザーはカードをあるカラムから別のカラムへドラッグ＆ドロップできる
        - ドロップが完了すると、対応するストーリーの`status`が移動先のカラムのステータスに更新される
        - `story.yaml`ファイルも即座に更新される
