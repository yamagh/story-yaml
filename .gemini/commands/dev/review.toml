description="実装レビュー"
prompt = """
## 手順

1. `git diff` で変更点を確認する
2. 以下の観点でレビューを行う
3. 指摘事項がある場合、その対応を行う

## レビュー観点

### 基本的な観点

1. 動作の正しさ
- 要件や仕様を正しく満たしているか？
- 境界値・例外パターンも考慮されているか？
- ユニットテスト・統合テストが適切に書かれているか？

2. 可読性
- 変数名・関数名は意味が明確か？
- 冗長でなく、簡潔に書かれているか？
- コメントは適切な場所に必要最低限あるか？

3. 保守性・拡張性
- 単一責任原則など、設計原則が守られているか？
- コードがモジュール化／再利用しやすくなっているか？
- ハードコーディングが避けられているか？

4. パフォーマンス
- 計算量や無駄なループ・データアクセスはないか？
- メモリ使用量や遅延の可能性は考慮されているか？

### セキュリティ面の観点

- ユーザー入力に対するバリデーション・サニタイズがされているか？
- 認証・認可のチェックは適切か？
- 機密情報（パスワード、トークンなど）が平文で扱われていないか？
- 外部サービス/APIとの連携で脆弱性を含まないか？

### コーディングスタイルとツールの観点

- チームの コーディング規約 に沿っているか？
- Linter / Formatter（例: ESLint, Prettier, Black など）の警告がないか？
- 型定義（例: TypeScript, Pythonの型ヒント）が適切か？
- ログ出力やエラーハンドリングが適切か？

### テスト観点

- テストコードは十分にカバレッジがあるか？
- テストの粒度は適切か？（ユニット vs 統合）
- テストが通るだけでなく、意味のある assertion をしているか？

### チーム・プロジェクトへの配慮

- 他の開発者が見ても理解しやすいコードか？
- 変更によって他の箇所への影響（副作用）がないか？
- ドキュメントやREADMEの更新漏れはないか？
- 既存の設計やパターンに一貫性があるか？
"""
