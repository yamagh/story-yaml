# 社員検索機能追加計画

この実装計画では、既存の社内ポータルシステム（Next.js + Express バックエンド）に社員検索機能を追加する。主に `pages/employees.tsx`、`api/employees.ts`、`components/SearchBar.tsx` の改修を行う。

---

## 1. 要件と前提

- 社員データは PostgreSQL に保存されており、既に `/api/employees` で全件取得するAPIが存在する。
- 今回は「名前」「部署」「メールアドレス」を対象に部分一致検索を可能にする。
- データ件数が1万件を超えるため、検索はクライアント側フィルタではなくサーバ側検索とする。

---

## 2. 実装タスクリスト

### 2.1 バックエンドの改修（`api/employees.ts`）

- [ ] APIのGETエンドポイントにクエリパラメータ（`name`, `department`, `email`）を追加
- [ ] Prisma ORM を使った条件付きクエリロジックを実装
- [ ] 入力バリデーション（SQLインジェクション対策）を追加

### 2.2 フロントエンドの追加（`components/SearchBar.tsx`, `pages/employees.tsx`）

- [ ] `SearchBar` コンポーネントを新規作成（name, department, email の入力欄）
- [ ] 検索条件をAPIに渡して結果を取得するフックを作成（例：`useEmployeeSearch()`）
- [ ] 検索結果を`EmployeeList`に渡し、レンダリングする
- [ ] ローディング・エラー表示・件数表示などのUX改善

---

## 3. テスト計画

### 3.1 ユニットテスト（Jest + Supertest）

- [ ] `/api/employees` に対する検索条件ごとのレスポンス検証
  - name = "田中" → 検索結果に「田中太郎」が含まれる
  - department = "営業" → 部署が営業の社員のみ
- [ ] 無効なクエリ（例：SQL注入文字列）の入力で 400 エラーを返すことを確認

### 3.2 UIテスト（React Testing Library）

- [ ] 入力フォームで条件を入力し、結果が正しく反映されるか
- [ ] 検索条件変更時にAPIが正しく呼ばれるか（モックを使って確認）

### 3.3 手動テスト

- [ ] 実データを用いた手動検索テスト（全条件組み合わせ）
- [ ] モバイル画面でのUI表示確認
```
