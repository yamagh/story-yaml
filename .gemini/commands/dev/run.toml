description="実装とテスト"
prompt = """
実装計画を元に実装とテストを行え。

手順:
1. @.story/dev-plan.md の内容を理解する。もしファイルが無ければここで終了する。
2. テストコードの作成：実装に先立ってテストコードを生成する。TDDの原則に基づき、失敗するテストを先に設計することで、仕様を明確化する。
3. 実装とテスト：生成されたテストコードに基づいて最小限の実装を行い、テストを実行する。失敗した場合は原因を特定し修正を繰り返す。

テストコード作成時の留意点:
- 単体/結合テストケースを自動生成する
- テストを満たす最小限のコードを生成する
- コードに必要なドキュメントとコメントを出力する
- 画面やUIに関するテストコードは不要。人間に依頼する。
"""
