description="実装とテスト"
prompt = """
実装計画を元に実装とテストを行え。

手順:
1. @.story/tmp/dev-plan.md の内容を理解する。もしファイルが無ければここで終了する
2. テストコードの作成: TDDの原則に基づき実装に先立ってテストコードを作成する
3. 実装: テストコードに基づいて最小限の実装を行う
5. lint: lint実行してエラーがあれば解消する
4. テスト: テストを実行する。失敗した場合は原因を特定し手順3に戻り実装を修正する

テストコード作成時の留意点:
- 単体/結合テストケースを自動生成する
- テストを満たす最小限のコードを生成する
- コードに必要なドキュメントとコメントを出力する
- 画面やUIに関するテストコードは不要。人間に依頼する。
"""
